services:
  netwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: netwatch-manager:latest
    container_name: netwatch-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - JWT_SECRET=${JWT_SECRET:-88a183515ca4c845f94d93540ae3fbdb91eb582236fa120539c3c5ee7c6883ba}
      - ENCRYPT_KEY=${ENCRYPT_KEY:-5c0f2edcf74b7e27a70a141ed9433f53f264bdcf95be94e772afef8ab526cc04}
    volumes:
      # Persistent SQLite Database storage
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/branding || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

